# Recall configuration
# ---------------------------
# Every AI task is routed to a provider + model here. Switching a task between
# local (ollama) and cloud (claude / openai) is an edit to this file — no code
# changes. Providers: claude | gemini | openai | ollama

transcription:
  # Runs locally on the GPU via faster-whisper (not part of the LLM routing).
  # Models: large-v3 (best), distil-large-v3 (faster, near-parity English),
  # medium, small. 8GB VRAM handles large-v3 with int8_float16.
  model: distil-large-v3
  device: cuda          # cuda | cpu | auto
  compute_type: int8_float16

tasks:
  summarize:            # per-lecture structured notes (M2)
    provider: claude
    model: claude-sonnet-5
    compare_with:       # offered in the UI beside the default, to compare quality
      - provider: gemini
        model: gemini-3.7-flash
      - provider: ollama
        model: qwen2.5:7b
  chat:                 # course Q&A tutor (M4)
    # Local by default so the tutor works with no API key. qwen2.5:7b answers
    # well from retrieved sources — the invented-detail problem it has when
    # summarising from nothing does not bite when it is given the passages.
    # Point this at gemini or claude once a key is in .env for better answers.
    provider: ollama
    model: qwen2.5:7b
  quiz:                 # quizzes & flashcards (M5)
    provider: ollama
    model: qwen2.5:7b
  embeddings:           # RAG vector embeddings (M4) — local keeps it free
    provider: ollama
    model: nomic-embed-text

storage:
  data_dir: ../data     # relative to backend/; audio, slides, sqlite db live here

# Network binding is NOT configured here — it is decided by how you launch
# uvicorn and vite, so a value in this file could not enforce anything. See
# "Access and security" in README.md.
